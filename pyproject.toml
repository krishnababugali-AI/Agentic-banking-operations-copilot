[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "agentic-banking-operations-copilot"
version = "0.1.0"
description = "Production-style Agentic AI banking operations copilot using LangChain, LangGraph, LangSmith, Ollama, FastAPI, and RAG."
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[tool.setuptools.packages.find]
include = ["app*"]